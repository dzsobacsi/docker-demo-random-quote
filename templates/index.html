<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card shadow-lg" style="max-width: 600px; width: 100%;">
            <div class="card-body p-5">
                <h1 class="card-title text-center mb-4">Random Quote Generator</h1>
                <div id="quote-container" class="mb-4">
                    <blockquote class="blockquote mb-3">
                        <p id="quote-text" class="fs-4 fst-italic">Click the button to get your first quote!</p>
                    </blockquote>
                    <footer class="blockquote-footer">
                        <cite id="quote-author" class="fs-5"></cite>
                    </footer>
                </div>
                <div id="loading" class="text-center mb-3" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <div class="text-center">
                    <button id="new-quote-btn" class="btn btn-primary btn-lg" onclick="getNewQuote()">
                        Get New Quote
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
